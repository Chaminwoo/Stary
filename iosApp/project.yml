# XcodeGen 프로젝트 정의 — .xcodeproj 는 커밋하지 않고 CI(macOS)에서 이 파일로 생성한다.
#   생성:  cd iosApp && xcodegen generate
# (Windows에서 텍스트로 iOS 프로젝트를 관리하기 위한 방식)
name: Stary
options:
  bundleIdPrefix: com.chaminwoo
  deploymentTarget:
    iOS: "16.0"   # NavigationStack / TextField(axis:) / PhotosPicker 등 사용
  createIntermediateGroups: true

# Swift Package 의존성 (CI/Xcode 가 자동 resolve).
#  - Firebase : Auth/Firestore/Storage (named DB stary-db 접근)
#  - GoogleSignIn : 구글 로그인 → Firebase Auth credential
#  - MapLibre : 안드로이드 DiaryMap 대응 지도(별 마커)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.6.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: "6.7.0"
  # 보상형 광고(2026-10-04 연결, 2026-10-07 복구) — 코드는 `#if canImport(...)` 로 감싸 두었다.
  #  - GoogleMobileAds : AdMob 폴백(제품 GoogleMobileAds). 12.x 라인의 Swift API(접두사 없는 MobileAds/RewardedAd) 기준.
  #  - LevelPlay       : 1순위 미디에이션(제품 UnityMediationSDK, 모듈 IronSource) + Unity Ads 어댑터(UnityAdsAdapter).
  #    ⚠️ LevelPlay SPM 은 `-ObjC` 링커 플래그를 수동으로 넣어야 한다(아래 OTHER_LDFLAGS). 설정법: docs/IOS_ADS_SETUP.md
  # ⚠️ **이 3개를 지우면 iOS 광고가 통째로 사라진다.** 2026-10-04 Mac 의 Xcode 네트워크 문제("invalid archive")로
  #    여기서 지웠더니 그 뒤 TestFlight 빌드 전부가 광고 SDK 없이 나가 "광고를 불러올 수 없어요"만 떴다(2026-10-07 발견).
  #    `#if canImport` 덕에 컴파일은 조용히 통과해서 아무도 몰랐다 → 이제 Release 빌드에서 SDK 가 없으면
  #    AdsManager.swift 의 `#error` 로 빌드를 멈춘다. 패키지 해석이 안 되면 지우지 말고 IOS_ADS_SETUP.md 7번(캐시 초기화 / CI 업로드)부터.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
  LevelPlay:
    url: https://github.com/ironsource-mobile/LevelPlay-Swift-Package.git
    from: "9.6.0"
  LevelPlayUnityAdsAdapter:
    url: https://github.com/ironsource-mobile/LevelPlay-UnityAds-Adapter-Swift-Package.git
    from: "5.12.0"

settings:
  base:
    # Info.plist 가 CFBundleShortVersionString 을 하드코딩하고 있던 버그 때문에 이 값이 지금까지
    # 한 번도 실제 빌드에 반영된 적이 없었다(2026-10-04 발견). App Store Connect 에는 이미 버전 "1.0"
    # 으로 빌드 9 까지 올라가 있어(Android 는 1.5.1) 새 버전("1.0.0")을 만들지 않도록 "1.0" 으로 맞춘다.
    MARKETING_VERSION: "1.0"
    # 위와 같은 이유로 CURRENT_PROJECT_VERSION 도 한 번도 반영된 적이 없었다 — ASC 에 이미 9 까지 있어
    # "Redundant Binary Upload" 발생. 10 으로 올림 — 다음 업로드 전엔 ASC TestFlight 탭의 최신 빌드 번호를
    # 확인하고 그보다 크게 맞출 것.
    # 11 (2026-10-07): 광고 SDK 복구 + 채팅 나만 삭제. 빌드 10 은 광고 SDK 없이 올라간 빌드.
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # CI 환경변수로 주입(Apple Team ID)

targets:
  Stary:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: AppDelegate.swift
      - path: Assets.xcassets
      # 본문/UI 폰트는 Android 와 **같은 파일**을 그대로 번들에 넣는다(9MB 복제·드리프트 방지).
      - path: ../androidApp/src/main/res/font/min_sans.ttf
        buildPhase: resources
      # 3D 글로브 지구/하늘/구름 텍스처도 Android assets 와 **같은 파일**을 참조(예전 iOS 사본은 7096px 로 달라 삭제, 2026-09).
      # 수채 지표·은하수 성운은 tools/globe/bake_globe_textures.py 로 구운 파일(2026-10-08, 원본 Blue Marble 은 tools/globe 로 이동).
      - path: ../androidApp/src/main/assets/globe_watercolor.jpg
        buildPhase: resources
      - path: ../androidApp/src/main/assets/globe_nebula.jpg
        buildPhase: resources
      - path: ../androidApp/src/main/assets/earth_clouds.jpg
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stary
        # GENERATE_INFOPLIST_FILE=NO(커스텀 Info.plist)라 actool 의 CFBundleIcons 머지만으로는
        # 최상위 CFBundleIconName 키가 안 들어가서 앱스토어 검증이 "Missing Info.plist value" 로 거절했다
        # (2026-10-04) — 여기 명시로 고정.
        CFBundleIconName: AppIcon
        # ⚠️ xcodegen 은 info.properties 에 명시 안 하면 CFBundleShortVersionString/CFBundleVersion 을
        # 매 generate 마다 "1.0"/"1" 리터럴로 되돌려 버려서 아래 MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # 빌드 설정이 무시되고 있었다("Redundant Binary Upload" 2026-10-04) — 변수로 고정.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # 앱 전역 다크(밤하늘) 톤
        UIUserInterfaceStyle: Dark
        # 푸시 알림(FCM/APNs) — 백그라운드 수신.
        UIBackgroundModes:
          - remote-notification
        # 회전 금지 — 기기 자동회전이 켜져 있어도 세로 고정(Android screenOrientation=portrait 패리티)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # 수출 규정(표준 암호화만 사용) — 심사 프롬프트 회피
        ITSAppUsesNonExemptEncryption: false
        # 보상형 광고 — 100m 밖 게시물 열람 해제(Core/AdsManager.swift). 값이 비면 해당 광고원은 꺼진다(앱은 정상 동작).
        # ⚠️ 값은 전부 Config/Local.secrets.xcconfig(gitignore)로 주입한다 — docs/IOS_ADS_SETUP.md.
        #  - LevelPlay: Android 와 **다른 값**(LevelPlay 에 따로 추가한 iOS 앱의 App Key / 보상형 Ad unit ID)
        #  - AdMob(폴백): GADApplicationIdentifier(앱 ID) 가 비어 있으면 SDK 를 시작하지 않는다(비어 있으면 AdMob 이 시작 크래시).
        LEVELPLAY_APP_KEY: $(LEVELPLAY_APP_KEY)
        LEVELPLAY_REWARDED_AD_UNIT: $(LEVELPLAY_REWARDED_AD_UNIT)
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        ADMOB_REWARDED_AD_UNIT: $(ADMOB_REWARDED_AD_UNIT)
        # ATT(앱 추적 투명성) 팝업 문구 — 광고 SDK 가 광고 식별자(IDFA)를 쓰기 전 필수.
        NSUserTrackingUsageDescription: 맞춤 광고를 보여주고 광고 품질을 개선하기 위해 광고 식별자를 사용해요. 허용하지 않아도 앱은 그대로 쓸 수 있어요.
        # SKAdNetwork — 광고 설치 어트리뷰션. Google(AdMob) + ironSource/Unity(LevelPlay) 필수분 + 주요 네트워크.
        # ⚠️ 목록은 네트워크 측에서 수시로 늘어난다 — Unity/구글 대시보드의 "누락 ID" 안내를 월 1회 확인해 보강(docs/IOS_ADS_SETUP.md 5-4).
        # ⚠️ Sources/Info.plist 에도 같은 목록이 있다(xcodegen 이 재생성하지만 커밋본도 맞춰 둔다).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork   # Google
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork   # ironSource(LevelPlay)
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork   # Unity Ads
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
