          # ↓ Unity(LevelPlay) 대시보드 "누락된 SKAdNetwork ID" 목록에서 보강(2026-10-07, SDK 3.5.1+ 기준 — 매월 확인 권장)
          - SKAdNetworkIdentifier: w9q455wk68.skadnetwork
