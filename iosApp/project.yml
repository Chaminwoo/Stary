# XcodeGen 프로젝트 정의 — .xcodeproj 는 커밋하지 않고 CI(macOS)에서 이 파일로 생성한다.
#   생성:  cd iosApp && xcodegen generate
# (Windows에서 텍스트로 iOS 프로젝트를 관리하기 위한 방식)
name: Stary
options:
  bundleIdPrefix: com.chaminwoo
  deploymentTarget:
    iOS: "16.0"   # NavigationStack / TextField(axis:) / PhotosPicker 등 사용
  createIntermediateGroups: true

# Swift Package 의존성 (CI/Xcode 가 자동 resolve).
#  - Firebase : Auth/Firestore/Storage (named DB stary-db 접근)
#  - GoogleSignIn : 구글 로그인 → Firebase Auth credential
#  - MapLibre : 안드로이드 DiaryMap 대응 지도(별 마커)
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.6.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "8.0.0"
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution.git
    from: "6.7.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # CI 환경변수로 주입(Apple Team ID)

targets:
  Stary:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: AppDelegate.swift
      # 본문/UI 폰트는 Android 와 **같은 파일**을 그대로 번들에 넣는다(9MB 복제·드리프트 방지).
      - path: ../androidApp/src/main/res/font/min_sans.ttf
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Stary
        UILaunchScreen: {}
        # 앱 전역 다크(밤하늘) 톤
        UIUserInterfaceStyle: Dark
        # 푸시 알림(FCM/APNs) — 백그라운드 수신.
        UIBackgroundModes:
          - remote-notification
        # 회전 금지 — 기기 자동회전이 켜져 있어도 세로 고정(Android screenOrientation=portrait 패리티)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # 수출 규정(표준 암호화만 사용) — 심사 프롬프트 회피
        ITSAppUsesNonExemptEncryption: false
        # OpenRouteService 도보 길찾기 키(빌드 설정으로 주입; 빈 값이면 길찾기 비활성)
        ORS_API_KEY: $(ORS_API_KEY)
        # MapTiler 벡터 타일 키(야경 커스텀 스타일용 — Android secrets.properties 의 MAPTILER_KEY 와 동일 값).
        # 빈 값이면 지도는 키 불필요한 데모 스타일로 폴백.
        MAPTILER_KEY: $(MAPTILER_KEY)
        # 커스텀 폰트(Android Type.kt 와 동일) — 영문 타이틀 PoetsenOne, 한글 본문/UI MinSans(가변).
        UIAppFonts:
          - poetsen_one_regular.ttf
          - min_sans.ttf
        # 런타임 권한 사용 설명(심사 필수)
        NSLocationWhenInUseUsageDescription: 주변의 별(다이어리)을 지도에 표시하기 위해 위치가 필요해요.
        NSCameraUsageDescription: 다이어리에 넣을 사진을 촬영하기 위해 카메라가 필요해요.
        NSPhotoLibraryUsageDescription: 다이어리에 넣을 사진을 선택하기 위해 사진 보관함 접근이 필요해요.
        # 구글 로그인 콜백 URL 스킴(REVERSED_CLIENT_ID). CI 에서 빌드 설정으로 주입.
        # + 공유 랜딩 → 앱 딥링크 스킴(stary://diary/{id}, 체크리스트 30).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLSchemes:
              - stary
    # Push Notifications 권한 — aps-environment. 배포(App Store/TestFlight) 아카이브 시
    # Xcode 가 production 으로 바꿔 넣는다. 자동 서명(-allowProvisioningUpdates)이 App ID 에도 권한을 켠다.
    # ⚠️ Sources/ 밖에 둔다 — sources 로 잡히면 앱 번들에 리소스로 복사될 수 있다.
    entitlements:
      path: Stary.entitlements
      properties:
        aps-environment: development
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        # Apple App ID 는 언더스코어(_) 불가 → stary_ios 대신 com.chaminwoo.stary.ios (점 표기, 2026-07-15).
        # 원본과의 분리 기준은 Firebase 프로젝트(f26c8)이지 이름 문자열이 아님 — 원본은 iOS 앱 없음.
        PRODUCT_BUNDLE_IDENTIFIER: com.chaminwoo.stary.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 구글 로그인 URL 스킴 — GoogleService-Info.plist 의 REVERSED_CLIENT_ID 와 반드시 동일.
        # (Firebase 에서 iOS 앱을 재등록/교체하면 이 값도 새 plist 의 REVERSED_CLIENT_ID 로 갱신할 것.)
        GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.7962996464-5l7ujh9t94uohohjvlqhrm6pj6efdvul"
        # OpenRouteService 도보 길찾기 키 placeholder(실제 값은 CI/xcconfig 로 주입)
        ORS_API_KEY: ""
        # MapTiler 키 placeholder(실제 값은 CI/xcconfig/Xcode 빌드 설정으로 주입 — 커밋 금지)
        MAPTILER_KEY: ""
        # KMP 공유 정적 프레임워크(embedAndSignAppleFrameworkForXcode 산출 경로)
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: "Build Kotlin Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
