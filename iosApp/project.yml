    # Push Notifications 권한 — aps-environment. 배포(App Store/TestFlight) 아카이브 시
    # Xcode 가 production 으로 바꿔 넣는다. 자동 서명(-allowProvisioningUpdates)이 App ID 에도 권한을 켠다.
    # ⚠️ Sources/ 밖에 둔다 — sources 로 잡히면 앱 번들에 리소스로 복사될 수 있다.
    entitlements:
      path: Stary.entitlements
      properties:
        aps-environment: development
        # Sign in with Apple(App Store 심사 Guideline 4.8 대응) — Apple 개발자 포털의 App ID 에도
        # 이 Capability 를 켜야 한다(자동 서명이면 -allowProvisioningUpdates 가 함께 반영).
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: MapLibre
        product: MapLibre
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: LevelPlay
        product: UnityMediationSDK
      - package: LevelPlayUnityAdsAdapter
        product: UnityAdsAdapter
    settings:
      base:
        # Apple App ID 는 언더스코어(_) 불가 → stary_ios 대신 com.chaminwoo.stary.ios (점 표기, 2026-07-15).
        # 원본과의 분리 기준은 Firebase 프로젝트(f26c8)이지 이름 문자열이 아님 — 원본은 iOS 앱 없음.
        PRODUCT_BUNDLE_IDENTIFIER: com.chaminwoo.stary.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 구글 로그인 URL 스킴 — GoogleService-Info.plist 의 REVERSED_CLIENT_ID 와 반드시 동일.
        # (Firebase 에서 iOS 앱을 재등록/교체하면 이 값도 새 plist 의 REVERSED_CLIENT_ID 로 갱신할 것.)
        GOOGLE_REVERSED_CLIENT_ID: "com.googleusercontent.apps.7962996464-5l7ujh9t94uohohjvlqhrm6pj6efdvul"
        # 광고 키(LEVELPLAY_*, ADMOB_*)도 MapTiler 와 같은 이유로 여기서 설정하지 않는다 —
        # target 명시 설정이 xcconfig 보다 우선해서 Local.secrets.xcconfig 값을 항상 빈 값으로 덮어써 버린다(2026-10-04 제거).
        # 값이 없으면 $(…) 가 빈 문자열로 풀려 광고만 꺼진다.
        # MapTiler 키는 여기서 설정하지 않는다 — Config/Local.xcconfig(아래 configFiles)가 주입한다.
        # (여기 두면 target 명시 설정이 xcconfig 보다 우선순위가 높아 항상 덮어써버린다.)
        # Meta(인스타) 앱 ID placeholder(실제 값은 CI/xcconfig 로 주입 — 커밋 금지)
        INSTAGRAM_APP_ID: ""
        # KMP 공유 정적 프레임워크(embedAndSignAppleFrameworkForXcode 산출 경로)
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          # LevelPlay SPM 패키지는 unsafeFlags 를 못 넣어 `-ObjC` 를 앱 쪽에서 직접 준다(공식 문서).
          - -ObjC
    # 로컬 전용 xcconfig — MAPTILER_KEY 등 로컬 시크릿 자동 주입(Config/Local.secrets.xcconfig, gitignore).
    # 파일이 없어도 Local.xcconfig 의 #include? 가 조용히 넘어가므로 CI/다른 팀원 클론에는 영향 없음.
    configFiles:
      Debug: Config/Local.xcconfig
      Release: Config/Local.xcconfig
    preBuildScripts:
      - name: "Build Kotlin Shared.framework"
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --no-daemon
