        # MapTiler 벡터 타일 키(야경 커스텀 스타일용 — Android secrets.properties 의 MAPTILER_KEY 와 동일 값).
        # 빈 값이면 지도는 키 불필요한 데모 스타일로 폴백.
        MAPTILER_KEY: $(MAPTILER_KEY)
        # 인스타 스토리 공유의 source_application(Meta 앱 ID) — Android secrets.properties INSTAGRAM_APP_ID 와 같은 값.
        # 빈 값이면 링크 스티커 자동 부착 없이 배경 이미지만 넘긴다(Android 와 동일 정책).
        INSTAGRAM_APP_ID: $(INSTAGRAM_APP_ID)
        # 인스타 설치 여부 확인(canOpenURL)에 필요 — 없으면 항상 false 가 나와 일반 공유로만 빠진다.
        LSApplicationQueriesSchemes:
          - instagram-stories
        # 커스텀 폰트(Android Type.kt 와 동일) — 영문 타이틀 PoetsenOne, 한글 본문/UI MinSans(가변).
        UIAppFonts:
          - poetsen_one_regular.ttf
          - min_sans.ttf
        # 런타임 권한 사용 설명(심사 필수)
        NSLocationWhenInUseUsageDescription: 주변의 별(다이어리)을 지도에 표시하기 위해 위치가 필요해요.
        NSCameraUsageDescription: 다이어리에 넣을 사진을 촬영하기 위해 카메라가 필요해요.
        NSPhotoLibraryUsageDescription: 다이어리에 넣을 사진을 선택하기 위해 사진 보관함 접근이 필요해요.
        # 구글 로그인 콜백 URL 스킴(REVERSED_CLIENT_ID). CI 에서 빌드 설정으로 주입.
        # + 공유 랜딩 → 앱 딥링크 스킴(stary://diary/{id}, 체크리스트 30).
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLSchemes:
