name: iOS

# 맥 없이 iOS 빌드: macOS 러너가 공유 KMP 프레임워크 + SwiftUI 앱을 컴파일한다.
#  - build  : push/PR 마다 시뮬레이터 빌드(서명 불필요) → 컴파일 그린/레드 신호
#  - deploy : 수동 실행(Actions 탭 → Run workflow, upload=true) + 서명 시크릿 필요.
#             TestFlight 업로드와 함께 실제 서명된 .ipa 를 Actions 아티팩트로도 남긴다(다운로드 가능).
#             필요 시크릿: APP_STORE_CONNECT_KEY_ID / _ISSUER_ID / _API_KEY(.p8 base64), IOS_DEVELOPMENT_TEAM.
#             (GOOGLE_SERVICE_INFO_PLIST 시크릿은 더 이상 필수 아님 — 실제 파일이 iosApp/Sources/ 에 커밋됨.)
on:
  push:
    paths:
      - "iosApp/**"
      - "shared/**"
      - "gradlew"
      - "gradle/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "iosApp/**"
      - "shared/**"
      - "gradlew"
      - "gradle/**"
  workflow_dispatch:
    inputs:
      upload:
        description: "TestFlight 업로드까지 진행"
        type: boolean
        default: false

jobs:
  build:
    name: Build (simulator, no signing)
    runs-on: macos-15   # Xcode 16+ — XcodeGen 2.45 가 만드는 프로젝트 포맷(77) 호환
    env:
      # 스텝 if: 는 secrets 컨텍스트를 직접 못 읽는다("Unrecognized named-value: 'secrets'") →
      # job 레벨 env 로 한 번 감싸 if: 에서 env.* 로 읽는다.
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest-stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # :shared(iOS 프레임워크) 빌드 시 Gradle 이 :androidApp 까지 구성 → AGP 가 SDK 위치(local.properties)를 요구.
      # xcodebuild 스크립트 환경엔 ANDROID_HOME 이 안 넘어가므로 sdk.dir 을 파일로 명시.
      - name: local.properties 작성 (Android SDK 위치)
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      # GoogleService-Info.plist 는 2026-07-15 부터 iosApp/Sources/ 에 실제 파일이 커밋되어 있어
      # checkout 만으로 이미 존재한다. 이 스텝은 시크릿으로 다른 값을 강제로 덮어쓰고 싶을 때만 쓰는
      # 선택적 오버라이드 — 시크릿 미설정이면(기본) 건드리지 않는다.
      - name: (선택) GoogleService-Info.plist 오버라이드
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST != '' }}
        run: |
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/Sources/GoogleService-Info.plist

      - name: Generate Xcode project
        run: cd iosApp && xcodegen generate

      # 실패 시 Swift 컴파일 에러를 ::error:: 어노테이션으로 노출 — 로그 다운로드 권한 없이도
      # check-runs annotations API(공개)로 에러 줄을 읽을 수 있다.
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project iosApp/Stary.xcodeproj \
            -scheme Stary \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -60; then
            echo "── Swift 컴파일 에러 ──"
            grep -E " error: " build.log | head -40 | sort -u | while IFS= read -r l; do
              echo "::error::${l}"
            done
            exit 65
          fi

  deploy:
    name: TestFlight 업로드 + IPA 아티팩트
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY }}   # base64(.p8)
      DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      # 스텝 if: 는 secrets 컨텍스트를 직접 못 읽는다("Unrecognized named-value: 'secrets'") →
      # job 레벨 env 로 한 번 감싸 if: 에서 env.* 로 읽는다.
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (latest-stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: iosApp

      - name: local.properties 작성 (Android SDK 위치)
        run: echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties

      # GoogleService-Info.plist 는 iosApp/Sources/ 에 실제 파일이 커밋되어 있어 checkout 만으로 존재.
      # 시크릿으로 다른 값을 강제 오버라이드하고 싶을 때만 쓰는 선택 스텝(기본은 건드리지 않음).
      - name: (선택) GoogleService-Info.plist 오버라이드
        if: ${{ env.GOOGLE_SERVICE_INFO_PLIST != '' }}
        run: echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > iosApp/Sources/GoogleService-Info.plist

      # 광고 키(보상형) + 지도 키 — GitHub Secrets 에 값을 넣으면 Local.secrets.xcconfig 로 써서 빌드에 주입한다
      # (없으면 해당 기능만 꺼짐: 광고 없음 / 지도는 데모 스타일).
      # Mac 로컬 Local.secrets.xcconfig 와 같은 키를 써야 CI 업로드본이 로컬 업로드본과 같아진다(2026-10-07 MAPTILER_KEY 추가).
      # 설정법: docs/IOS_ADS_SETUP.md. 값에 `//` 가 들어가면 xcconfig 가 주석으로 먹으니 주의(AdMob/LevelPlay ID 에는 없음).
      - name: (선택) 광고·지도 키 주입 → Local.secrets.xcconfig
        env:
          LEVELPLAY_APP_KEY: ${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_REWARDED_AD_UNIT: ${{ secrets.LEVELPLAY_REWARDED_AD_UNIT }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_UNIT: ${{ secrets.ADMOB_REWARDED_AD_UNIT }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          {
            echo "LEVELPLAY_APP_KEY = $LEVELPLAY_APP_KEY"
            echo "LEVELPLAY_REWARDED_AD_UNIT = $LEVELPLAY_REWARDED_AD_UNIT"
            echo "ADMOB_APP_ID = $ADMOB_APP_ID"
            echo "ADMOB_REWARDED_AD_UNIT = $ADMOB_REWARDED_AD_UNIT"
            echo "MAPTILER_KEY = $MAPTILER_KEY"
          } > iosApp/Config/Local.secrets.xcconfig
          # 값은 찍지 않고 "들어갔는지"만 남긴다 — 비어 있으면 그 기능이 꺼진 채 업로드된다.
          for k in LEVELPLAY_APP_KEY LEVELPLAY_REWARDED_AD_UNIT ADMOB_APP_ID ADMOB_REWARDED_AD_UNIT MAPTILER_KEY; do
            if [ -z "${!k}" ]; then echo "::warning::$k 시크릿이 비어 있다 — 이 업로드본은 해당 기능이 꺼진다"; fi
          done

      - name: fastlane beta (TestFlight 업로드 + build/*.ipa 생성)
        working-directory: iosApp
        run: bundle exec fastlane beta

      # fastlane build_app 이 iosApp/../build(=레포 루트 build/)에 남긴 .ipa 를 Actions 아티팩트로 노출.
      # Actions 실행 화면 → Artifacts 에서 90일간 다운로드 가능(TestFlight 처리 대기 없이 바로 받을 수 있음).
      - name: IPA 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stary-ipa
          path: build/*.ipa
          retention-days: 90
          if-no-files-found: warn
