<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stary — 그 장소에 가야 열리는 별</title>
<meta name="description" content="이 별은 그 장소에 가야 열려요. 지도 위 밤하늘에 남기는 위치 다이어리, Stary.">
<!-- 링크 프리뷰(카카오톡/인스타 DM/X/디스코드). og:image 가 없으면 회색 빈 박스로 뜬다.
     ⚠️ og:url / canonical 은 일부러 넣지 않는다 — 정적 SPA 라 모든 /s/{id} 가 같은 HTML 이고,
        고정 og:url 을 주면 크롤러가 서로 다른 공유 링크를 하나로 합쳐 캐시한다.
        별마다 다른 제목·이미지가 필요하면 /s/{id} 를 Cloud Function 으로 SSR 해야 한다. -->
<meta property="og:site_name" content="Stary">
<meta property="og:title" content="Stary — 누군가 밤하늘에 별을 남겼어요">
<meta property="og:description" content="이 별은 그 장소에 가야 열려요. 지도 위 밤하늘에 남기는 위치 다이어리, Stary.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="https://momentdiary-f26c8.web.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Stary — 지도 위 밤하늘에 남기는 위치 다이어리">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Stary — 누군가 밤하늘에 별을 남겼어요">
<meta name="twitter:description" content="이 별은 그 장소에 가야 열려요. 지도 위 밤하늘에 남기는 위치 다이어리, Stary.">
<meta name="twitter:image" content="https://momentdiary-f26c8.web.app/og.png">
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    background: linear-gradient(180deg, #0B1026 0%, #070A18 55%, #04050C 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; text-align: center;
  }
  #sky { position: fixed; inset: 0; z-index: 0; }
  main { position: relative; z-index: 1; padding: 32px 24px; max-width: 420px; }
  .star {
    width: 120px; height: 120px; margin: 0 auto 28px;
    filter: drop-shadow(0 0 18px rgba(110, 231, 183, 0.75));
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1);   filter: drop-shadow(0 0 14px rgba(110,231,183,.55)); }
    50%      { transform: scale(1.06); filter: drop-shadow(0 0 26px rgba(110,231,183,.9)); }
  }
  h1 { font-size: 1.45rem; line-height: 1.45; font-weight: 700; margin-bottom: 12px; }
  p.desc { font-size: .95rem; line-height: 1.6; color: rgba(255,255,255,.72); margin-bottom: 34px; }
  .btn {
    display: block; width: 100%; padding: 15px 0; border-radius: 14px;
    font-size: 1rem; font-weight: 700; text-decoration: none; margin-bottom: 12px;
  }
  .btn-primary { background: #6EE7B7; color: #06281C; }
  .btn-ghost { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.16); }
  .brand { margin-top: 40px; letter-spacing: .32em; font-weight: 700; font-size: .9rem; color: rgba(255,255,255,.85); }
  .tagline { margin-top: 8px; font-size: .75rem; color: rgba(255,255,255,.45); }
  button.btn { font-family: inherit; cursor: pointer; border: 0; -webkit-appearance: none; appearance: none; }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .kicker, #share { display: none; }

  /* ── 친구 초대 페이지(/i/{uid}) — 앱과 같은 3D 글로브를 배경으로, 수락/친구 초대 버튼 패널을 올린다.
        글로브는 globe/globe.js(WebGL). 불가하면 body.globe-on 이 빠져 예전 별 아이콘 화면으로 폴백. ── */
  #globe { display: none; position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; touch-action: none; cursor: grab; }
  #globe:active { cursor: grabbing; }
  body.globe-on #globe { display: block; }
  body.globe-on #sky, body.globe-on .star { display: none; }
  body.invite { display: block; background: #02030a; }
  body.invite main {
    position: fixed; left: 0; right: 0; bottom: 0; max-width: none;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom)); pointer-events: none;
  }
  body.invite .panel {
    pointer-events: auto; max-width: 440px; margin: 0 auto; padding: 22px 20px 16px; border-radius: 26px;
    background: rgba(8, 12, 30, .58); border: 1px solid rgba(255,255,255,.12);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 18px 60px rgba(0,0,0,.45);
  }
  body.invite .kicker { display: block; font-size: .68rem; letter-spacing: .34em; font-weight: 700; color: #9FD8FF; margin-bottom: 10px; }
  body.invite h1 { font-size: 1.32rem; margin-bottom: 10px; word-break: keep-all; }
  body.invite p.desc { font-size: .88rem; margin-bottom: 20px; word-break: keep-all; text-wrap: balance; }
  body.invite p.desc .l { display: block; text-wrap: balance; }
  body.invite p.desc .l + .l { margin-top: 4px; }
  body.invite .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  body.invite .actions .btn { margin: 0; padding: 15px 0; display: flex; align-items: center; justify-content: center; }
  body.invite #share { display: flex; }
  body.invite .btn-primary { box-shadow: 0 0 28px rgba(110,231,183,.35); }
  body.invite #store {
    background: none; border: 0; color: rgba(255,255,255,.72); font-size: .85rem; font-weight: 600;
    padding: 12px 0 2px; margin: 4px 0 0;
  }
  body.invite .brand { margin-top: 10px; font-size: .72rem; opacity: .6; }
  body.invite .tagline { display: none; }
  body:not(.invite) .panel { display: contents; }
  /* 넓은 화면: 글로브는 왼쪽, 패널은 오른쪽 세로 가운데(globeBox() 의 landscape 조건과 같아야 한다) */
  @media (min-width: 820px) and (min-aspect-ratio: 1/1) {
    body.invite main { left: auto; top: 0; width: min(500px, 40vw); display: flex; align-items: center; padding: 24px 40px 24px 0; }
    body.invite .panel { margin: 0; }
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    z-index: 5; padding: 11px 18px; border-radius: 999px; font-size: .85rem; font-weight: 600; color: #06281C;
    background: #6EE7B7; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .star { animation: none; } #toast { transition: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="globe" aria-hidden="true"></canvas>
<main>
  <div class="panel" id="panel">
    <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#6EE7B7" d="M50 4 Q54 42 50 50 Q54 58 50 96 Q46 58 50 50 Q46 42 50 4 Z
        M4 50 Q42 46 50 50 Q58 46 96 50 Q58 54 50 50 Q42 54 4 50 Z"/>
    </svg>
    <div class="kicker">✦ INVITATION</div>
    <h1 id="headline">누군가 밤하늘에<br>별 하나를 남겼어요</h1>
    <p class="desc" id="desc">이 별은 <b>그 장소에 가야</b> 열려요.<br>
      Stary 앱을 열고, 별이 뜬 곳으로 걸어가 보세요.</p>
    <div class="actions">
      <a class="btn btn-primary" id="openApp" href="#">앱에서 별 보기</a>
      <button type="button" class="btn btn-ghost" id="share">친구 초대하기</button>
    </div>
    <a class="btn btn-ghost" id="store" href="#" aria-disabled="true">앱 설치 (준비 중)</a>
    <div class="brand">S T A R Y</div>
    <div class="tagline">지도 위 밤하늘에 남기는 위치 다이어리</div>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  // 경로에서 모드/코드 추출 → 앱 딥링크 구성.
  //  /s/{diaryId} (?d= 폴백) = 별 공유 → stary://diary/{id}
  //  /i/{uid}     (?i= 폴백) = 친구 초대 → stary://invite/{uid}
  (function () {
    // Android: Play 프로덕션 출시됨. iOS: App Store 출시됨(2026-10) — AppConfig.appStoreUrl / StaryConfig.APP_STORE_URL 과 동일.
    var STORE_URL_ANDROID = "https://play.google.com/store/apps/details?id=com.chaminwoo.stary_ios";
    var STORE_URL_IOS = "https://apps.apple.com/us/app/stary/id6799375537";
    // iPadOS 13+ 의 Safari 는 UA 가 Macintosh 로 오므로 터치 지원 여부로 한 번 더 확인한다.
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
    var storeUrl = isIOS ? STORE_URL_IOS : STORE_URL_ANDROID;

    var share = location.pathname.match(/^\/s\/([\w-]+)/);
    var invite = location.pathname.match(/^\/i\/([\w-]+)/);
    var qs = new URLSearchParams(location.search);
    var btn = document.getElementById("openApp");
    if (invite || qs.get("i")) {
      var code = (invite && invite[1]) || qs.get("i") || "";
      document.body.classList.add("invite");
      document.getElementById("headline").innerHTML = "친구가 당신을<br>Stary 로 초대했어요";
      document.getElementById("desc").innerHTML =
        '<span class="l">초대를 수락하고 가입하면 <b>두 사람 모두 특별한 칭호</b>를 받아요 ✦</span>' +
        '<span class="l">앱이 없다면 먼저 설치한 뒤, 이 링크를 다시 열어 주세요.</span>';
      btn.textContent = "초대 수락";
      btn.href = "stary://invite/" + encodeURIComponent(code);
      setupShare(code);
      startGlobe();
    } else {
      var id = (share && share[1]) || qs.get("d") || "";
      btn.href = "stary://diary/" + encodeURIComponent(id);
    }
    var storeBtn = document.getElementById("store");
    if (storeUrl) {
      storeBtn.href = storeUrl;
      storeBtn.setAttribute("aria-disabled", "false");
      storeBtn.textContent = isIOS ? "App Store 에서 설치" : "Play 스토어에서 설치";
    }

    // 미설치 폴백 — 커스텀 스킴(stary://)은 앱이 없으면 **아무 일도 일어나지 않는다.**
    // 눌렀는데 페이지가 그대로면(앱이 열렸다면 탭이 백그라운드로 간다) 스토어로 보낸다.
    // ⚠️ iOS 는 제외 — 앱이 설치돼 있으면 Safari 가 "Stary 에서 열까요?" 확인창을 띄우는데 그동안 페이지는 그대로
    //    보이므로, 타이머가 확인창 위로 App Store 를 덮어 버린다. iOS 는 아래 "App Store 에서 설치" 버튼으로 직접 가게 둔다.
    btn.addEventListener("click", function () {
      if (!storeUrl || isIOS) return;
      var t = Date.now();
      setTimeout(function () {
        if (document.hidden || Date.now() - t > 2200) return; // 앱이 열렸음
        location.href = storeUrl;
      }, 1400);
    });
  })();

  // ── 친구 초대: "친구 초대하기" = 이 초대 링크를 다른 친구에게도 공유(Web Share, 안 되면 링크 복사) ──
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (ok, fail) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;opacity:0;top:0;left:0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? ok() : fail(); } catch (e) { fail(e); } finally { document.body.removeChild(ta); }
    });
  }
  function setupShare(code) {
    var url = code ? location.origin + "/i/" + encodeURIComponent(code) : location.href;
    document.getElementById("share").addEventListener("click", function () {
      var data = { title: "Stary", text: "Stary 에서 같이 별을 남겨요 ✦ 지도 위 밤하늘에 남기는 위치 다이어리", url: url };
      if (navigator.share) {
        navigator.share(data).catch(function (e) { if (e && e.name !== "AbortError") copyThenToast(); });
      } else { copyThenToast(); }
      function copyThenToast() {
        copyText(url).then(function () { toast("초대 링크를 복사했어요"); },
                           function () { toast("링크를 복사하지 못했어요 — 주소창의 링크를 공유해 주세요"); });
      }
    });
  }

  // ── 앱과 같은 3D 글로브(globe/globe.js — Android GlobeRenderer 의 WebGL 포팅) ──
  // 지구는 화면 위쪽(세로) / 왼쪽(가로 넓은 화면)에 두고 패널을 반대편에 둔다. 조건은 위 CSS 미디어쿼리와 같아야 한다.
  function globeBox() {
    var W = innerWidth, H = innerHeight, p = document.getElementById("panel").getBoundingClientRect();
    if (W >= 820 && W / H >= 1) {
      var bw = Math.max(260, p.left - 16);
      return { cx: bw / 2, cy: H / 2, r: Math.min(bw * 0.44, H * 0.40) };
    }
    var bh = Math.max(200, p.top - 8);
    return { cx: W / 2, cy: bh / 2 + 4, r: Math.min(W * 0.42, bh * 0.44) };
  }
  function startGlobe() {
    function fallback() { document.body.classList.remove("globe-on"); startSky(); }   // WebGL 불가/실패 → 예전 별 아이콘 + 잔별 화면
    document.body.classList.add("globe-on");
    var s = document.createElement("script");
    s.src = "/globe/globe.js";
    s.onerror = fallback;
    s.onload = function () {
      try {
        StaryGlobe.start(document.getElementById("globe"), {
          land: "/globe/globe_land.jpg", nebula: "/globe/globe_nebula.jpg", box: globeBox, onLost: fallback
        }).catch(function (e) { console.warn("globe", e); fallback(); });
      } catch (e) { console.warn("globe", e); fallback(); }
    };
    document.head.appendChild(s);
  }

  // 밤하늘 캔버스 — 잔별 + 반짝임. (초대 페이지는 글로브가 자기 별밭을 그리므로 글로브가 실패했을 때만 시작한다)
  var skyStarted = false;
  function startSky() {
    if (skyStarted) return;
    skyStarted = true;
    var c = document.getElementById("sky"), ctx = c.getContext("2d"), stars = [];
    function resize() {
      c.width = innerWidth * devicePixelRatio;
      c.height = innerHeight * devicePixelRatio;
      stars = Array.from({ length: 140 }, function () {
        return {
          x: Math.random() * c.width, y: Math.random() * c.height,
          r: (0.4 + Math.random() * 1.4) * devicePixelRatio,
          p: Math.random() * Math.PI * 2, s: 0.4 + Math.random() * 1.2
        };
      });
    }
    addEventListener("resize", resize); resize();
    (function draw(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      stars.forEach(function (st) {
        var a = 0.25 + 0.6 * Math.abs(Math.sin(st.p + t * 0.0006 * st.s));
        ctx.globalAlpha = a;
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
      });
      requestAnimationFrame(draw);
    })(0);
  }
  if (!document.body.classList.contains("invite")) startSky();
</script>
</body>
</html>
